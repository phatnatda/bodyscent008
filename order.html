<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">BODY SCENT</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="divider">
        <p>กรอกข้อมูลด้านล่าง แล้วเราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="form-wrap">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="brand">BODY SCENT</a>
      <p>© 2026 Body Scent. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
